<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HexFlow Output</title>
<style>
  :root {
    color-scheme: dark;
    --page: #141414; --surface: #262626; --ink: #f2f2f2; --line: #4a4a4a; --accent: #ffffff;
  }
  :root.light {
    color-scheme: light;
    --page: #f4f4f4; --surface: #fafafa; --ink: #171717; --line: #b8b8b8; --accent: #171717;
  }
  body { margin: 0; padding: 14px; background: var(--page); color: var(--ink); font: 14px system-ui, sans-serif; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; }
  [role="status"] { color: var(--accent); font-weight: 650; }
  button {
    min-height: 40px; background: var(--surface); color: inherit; border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 15px;
  }
  button:disabled { opacity: .48; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
  pre {
    margin: 0; min-height: 80px; padding: 12px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; font: 14px/1.55 ui-monospace, monospace;
  }
</style>
</head>
<body>
<header><span id="state" role="status">Preparing runtime…</span><button id="stop" disabled>Stop</button></header>
<pre id="output" aria-label="Program output"></pre>
<script src="runner.js"></script>
</body>
</html>
